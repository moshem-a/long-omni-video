<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d8bff"/>
      <stop offset="1" stop-color="#8a6dff"/>
    </linearGradient>
    <style>
      .bg{fill:#0f1115}
      .card{fill:#171a21;stroke:#2a2f3a;rx:12}
      .card2{fill:#1e222b;stroke:#2a2f3a}
      .t{fill:#e7e9ee}
      .m{fill:#9aa3b2}
      .title{font-weight:700}
      .edge{stroke:#3a4152;stroke-width:2;fill:none}
      .edge-a{stroke:url(#accent);stroke-width:2.5;fill:none}
      .lbl{fill:#9aa3b2;font-size:11px}
    </style>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6d8bff"/>
    </marker>
    <marker id="arwg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3a4152"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1040" height="620"/>
  <text class="t title" x="28" y="40" font-size="22">AI Video Studio — Architecture</text>
  <text class="m" x="28" y="62" font-size="13">No login · your Gemini key stays in the browser · Gemini Omni 1.1 for video</text>

  <!-- Browser -->
  <rect class="card" x="28" y="90" width="230" height="200" rx="14" fill="#171a21" stroke="#2a2f3a"/>
  <text class="t title" x="48" y="120" font-size="15">🖥️ Browser (your device)</text>
  <rect class="card2" x="48" y="138" width="190" height="52" rx="10"/>
  <text class="t" x="60" y="160" font-size="13">Two-mode UI</text>
  <text class="m" x="60" y="178" font-size="12">Edit · Generate</text>
  <rect class="card2" x="48" y="200" width="190" height="66" rx="10"/>
  <text class="t" x="60" y="222" font-size="13">localStorage</text>
  <text class="m" x="60" y="240" font-size="11">x-gemini-key</text>
  <text class="m" x="60" y="256" font-size="11">x-client-id</text>

  <!-- Cloud Run -->
  <rect class="card" x="330" y="90" width="380" height="450" rx="14" fill="#171a21" stroke="#2a2f3a"/>
  <text class="t title" x="352" y="120" font-size="15">☁️ Cloud Run — public, no server-side auth</text>
  <text class="m" x="352" y="138" font-size="11">4 GiB · 2 vCPU · no CPU throttling · 1 always-on instance</text>

  <rect class="card2" x="352" y="152" width="336" height="46" rx="10"/>
  <text class="t" x="366" y="173" font-size="13">attachIdentity middleware</text>
  <text class="m" x="366" y="190" font-size="11">key → req.apiKey (memory only, never persisted)</text>

  <rect class="card2" x="352" y="206" width="336" height="40" rx="10"/>
  <text class="t" x="366" y="231" font-size="13">Express API + single-slot job queue</text>

  <!-- Edit pipeline -->
  <rect class="card2" x="352" y="258" width="164" height="266" rx="10"/>
  <text class="t title" x="366" y="280" font-size="13">✂️ Edit pipeline</text>
  <rect x="366" y="292" width="136" height="40" rx="8" fill="#11141b"/>
  <text class="t" x="378" y="310" font-size="12">Analyze</text>
  <text class="m" x="378" y="325" font-size="10">gemini-3.7-flash</text>
  <rect x="366" y="342" width="136" height="40" rx="8" fill="#11141b"/>
  <text class="t" x="378" y="360" font-size="12">TTS voiceover</text>
  <text class="m" x="378" y="375" font-size="10">3.1-flash-tts</text>
  <rect x="366" y="392" width="136" height="52" rx="8" fill="#11141b"/>
  <text class="t" x="378" y="410" font-size="12">ffmpeg assemble</text>
  <text class="m" x="378" y="425" font-size="10">cut · captions</text>
  <text class="m" x="378" y="438" font-size="10">music · mux</text>

  <!-- Generate pipeline -->
  <rect class="card2" x="524" y="258" width="164" height="266" rx="10"/>
  <text class="t title" x="538" y="280" font-size="13">🎬 Generate pipeline</text>
  <rect x="538" y="292" width="136" height="40" rx="8" fill="#11141b"/>
  <text class="t" x="550" y="310" font-size="12">Storyboard</text>
  <text class="m" x="550" y="325" font-size="10">gemini-3.7-flash</text>
  <rect x="538" y="342" width="136" height="42" rx="8" fill="#241d33" stroke="#8a6dff"/>
  <text class="t" x="550" y="360" font-size="12">Per-shot video</text>
  <text class="m" x="550" y="376" font-size="10" fill="#d3c2ff">Omni 1.1</text>
  <rect x="538" y="394" width="136" height="40" rx="8" fill="#11141b"/>
  <text class="t" x="550" y="412" font-size="12">Locked TTS voice</text>
  <text class="m" x="550" y="427" font-size="10">3.1-flash-tts</text>
  <rect x="538" y="444" width="136" height="52" rx="8" fill="#11141b"/>
  <text class="t" x="550" y="462" font-size="12">ffmpeg stitch</text>
  <text class="m" x="550" y="477" font-size="10">drop Omni audio</text>
  <text class="m" x="550" y="490" font-size="10">mux one voice</text>

  <!-- GCP services -->
  <rect class="card" x="782" y="90" width="230" height="450" rx="14" fill="#171a21" stroke="#2a2f3a"/>
  <text class="t title" x="802" y="120" font-size="15">Google Cloud</text>

  <rect class="card2" x="802" y="140" width="190" height="74" rx="10"/>
  <text class="t" x="816" y="162" font-size="13">Cloud Storage</text>
  <text class="m" x="816" y="180" font-size="11">uploads · shots · finals</text>
  <text class="m" x="816" y="196" font-size="11">v4 signed URLs</text>
  <text class="m" x="816" y="210" font-size="11">+ lifecycle cleanup</text>

  <rect class="card2" x="802" y="226" width="190" height="60" rx="10"/>
  <text class="t" x="816" y="248" font-size="13">Firestore</text>
  <text class="m" x="816" y="266" font-size="11">job history only</text>
  <text class="m" x="816" y="280" font-size="11">no keys stored</text>

  <rect class="card2" x="802" y="298" width="190" height="86" rx="10" stroke="#8a6dff"/>
  <text class="t" x="816" y="320" font-size="13">Gemini API</text>
  <text class="m" x="816" y="336" font-size="11" fill="#d3c2ff">Omni 1.1 (video)</text>
  <text class="m" x="816" y="352" font-size="11">3.7-flash (text)</text>
  <text class="m" x="816" y="368" font-size="11">3.7-flash-image · 3.1-tts</text>

  <!-- Edges -->
  <path class="edge-a" d="M258 200 H330" marker-end="url(#arw)"/>
  <text class="lbl" x="266" y="192">x-gemini-key + x-client-id</text>

  <path class="edge" d="M710 175 H782 V226" marker-end="url(#arwg)"/>
  <text class="lbl" x="716" y="168">history</text>

  <path class="edge" d="M688 415 H745 V341 H782" marker-end="url(#arwg)"/>
  <text class="lbl" x="700" y="408">signed URL I/O</text>

  <path class="edge" d="M688 372 H736 V341" marker-end="url(#arwg)"/>
  <text class="lbl" x="694" y="500">Gemini calls</text>
  <path class="edge" d="M516 372 H745 V385 H782" marker-end="url(#arwg)"/>

  <path class="edge" d="M143 266 V300 H320 V415 H352" marker-end="url(#arwg)"/>
  <text class="lbl" x="150" y="292">signed URL upload/download</text>
</svg>
